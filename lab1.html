<!DOCTYPE html>
<html lang="en"
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #222;
        }

        section {
            min-height: 33vh;
            padding: 40px 20px;
            text-align: center;
        }

        .intro {
            background-color: #050427;
            color: white;
        }

        .intro h1 {
            margin: 0 0 10px;
            font-size: 42px;
        }

        .about {
            background-color: white;
        }

        .projects {
            background-color: #e8eef8;
        }

        h2 {
            color: rgb(28, 28, 88);
            font-style: italic;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            max-width: 650px;
            margin: 0 auto 12px;
            line-height: 1.6;
        }

        ul {
            display: inline-block;
            text-align: left;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <section class="intro">
        <h1>Jana Hisham</h1>
        <p>Student at Faculty of Engineering, ASU</p>
    </section>

    <section class="about">
        <h2>About Me</h2>
        <p>
            I am an engineering student interested in web development, design,
            and learning how to build useful websites.
        </p>
    </section>

    <section class="projects">
        <h2>Projects</h2>
        <ul>
            <li>Portfolio Website</li>
            <li>HTML and CSS Practice Page</li>
            <li>Future Web Development Projects</li>
        </ul>
    </section>
</body>
</html>
